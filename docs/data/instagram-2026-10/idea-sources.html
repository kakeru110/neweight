<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP",sans-serif;background:#999;color:#1a1a1a}
.v{width:1080px;height:1350px;background:#fff;position:relative;overflow:hidden;margin-bottom:20px}
.hd{height:168px;padding:44px 48px 0;display:flex;flex-direction:column;justify-content:flex-start}
.hd .k{font-size:20px;letter-spacing:.22em;font-weight:700;color:#9a9a9a;margin-bottom:14px}
.hd h2{font-family:"Noto Serif JP",serif;font-size:46px;font-weight:600;line-height:1.3}
.g{position:absolute;left:0;right:0;bottom:0;top:168px;display:grid;
   grid-template-columns:537px 537px;grid-template-rows:repeat(3,1fr);gap:6px}
.c{position:relative;overflow:hidden}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c span{position:absolute;left:0;bottom:0;background:#fff;padding:11px 18px;
   font-size:23px;font-weight:700;letter-spacing:.06em;line-height:1}
.brand{position:absolute;right:22px;bottom:16px;color:#fff;font-size:18px;letter-spacing:.24em;
   font-weight:700;text-shadow:0 1px 10px rgba(0,0,0,.5)}
/* プリント拡大 */
.zoom{position:absolute;left:0;right:0;top:0;bottom:260px;overflow:hidden}
.zoom img{width:100%;height:100%;object-fit:cover;object-position:center 46%}
.cap{position:absolute;left:0;right:0;bottom:0;height:260px;padding:44px 52px}
.cap h2{font-family:"Noto Serif JP",serif;font-size:48px;font-weight:600;line-height:1.35}
.cap p{font-size:24px;line-height:1.75;color:#555;margin-top:18px}
.cap .b{position:absolute;right:52px;bottom:40px;font-size:20px;letter-spacing:.24em;font-weight:700;color:#bbb}
</style></head><body>

<div class="v" id="vGRID">
  <div class="hd"><div class="k">SIZE XS - L</div><h2>どの子にも、あります。</h2></div>
  <div class="g">
    <div class="c"><img src="br_yorkie.jpg" style="object-position:center 30%"><span>ヨークシャーテリア</span></div>
    <div class="c"><img src="br_chihuahua.jpg" style="object-position:center 35%"><span>ロングコートチワワ</span></div>
    <div class="c"><img src="bd_d_ow.jpg" style="object-position:center 35%"><span>ジャックラッセルテリア</span></div>
    <div class="c"><img src="br_boston.jpg" style="object-position:center 32%"><span>ボストンテリア</span></div>
    <div class="c"><img src="br_poodle.jpg" style="object-position:center 32%"><span>プードル</span></div>
    <div class="c"><img src="bd_d_sumi.jpg" style="object-position:center 26%"><span>ビーグル</span><span class="brand">SUMIF</span></div>
  </div>
</div>

<div class="v" id="vPRINT">
  <div class="zoom"><img src="bd_print.jpg"></div>
  <div class="cap">
    <h2>この中に、うちの子はいますか？</h2>
    <p>British Dogs のプリントには、5つの犬種の名前が入っています。<br>
    ジャックラッセルテリア／ボルゾイ／ポインター／<br>ワイヤーフォックステリア／ビーグル</p>
    <div class="b">SUMIF</div>
  </div>
</div>

</body></html>
