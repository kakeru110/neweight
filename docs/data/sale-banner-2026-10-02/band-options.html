<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#1a1a1a;}
.wrap{max-width:1180px;margin:0 auto;padding:0 0 40px;}
.lab{font-size:15px;color:#b81e1e;margin:34px 0 10px;}
.card{background:#fff;}
a{text-decoration:none;color:inherit;display:block;}

/* A 写真2分割 */
.a{display:flex;align-items:stretch;background:#f7f5f1;min-height:210px;}
.a__img{width:34%;background:url('fam_wide.jpg') center 42% / cover no-repeat;}
.a__txt{flex:1;padding:30px 36px;display:flex;flex-direction:column;justify-content:center;}
.a__eye{font-size:11px;letter-spacing:.3em;color:#b81e1e;font-weight:700;margin-bottom:9px;}
.a__h{font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.25;margin:0 0 9px;}
.a__h em{font-style:normal;font-size:42px;}
.a__s{font-size:13px;color:#5a5a5a;margin:0 0 16px;line-height:1.6;}
.a__b{display:inline-block;border:1px solid #1a1a1a;padding:9px 24px;font-size:13px;align-self:flex-start;}

/* B 文字＋商品3枚 */
.b{display:flex;align-items:center;background:#fff;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;min-height:196px;}
.b__txt{flex:1;padding:26px 34px;}
.b__eye{font-size:11px;letter-spacing:.3em;color:#b81e1e;font-weight:700;margin-bottom:8px;}
.b__h{font-size:34px;font-weight:700;margin:0 0 8px;line-height:1.2;}
.b__h em{font-style:normal;font-size:46px;}
.b__s{font-size:13px;color:#5a5a5a;margin:0;}
.b__ims{display:flex;gap:2px;height:196px;}
.b__ims span{width:150px;background-size:cover;background-position:center 34%;}

/* C 全面写真＋オーバーレイ */
.c{position:relative;min-height:210px;background:url('fam_strip.jpg') center 52% / cover no-repeat;display:flex;align-items:center;justify-content:center;}
.c::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42);}
.c__in{position:relative;z-index:1;text-align:center;color:#fff;padding:24px;}
.c__eye{font-size:11px;letter-spacing:.3em;font-weight:700;margin-bottom:10px;opacity:.9;}
.c__h{font-size:34px;font-weight:700;margin:0 0 8px;}
.c__h em{font-style:normal;font-size:46px;}
.c__s{font-size:13px;opacity:.82;margin:0 0 14px;}
.c__b{display:inline-block;border:1px solid #fff;padding:9px 26px;font-size:13px;}

/* D タイポのみ */
.d{background:#f7f5f1;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;padding:30px 24px;text-align:center;}
.d__eye{font-size:11px;letter-spacing:.3em;color:#b81e1e;font-weight:700;margin-bottom:10px;}
.d__h{font-size:34px;font-weight:700;margin:0 0 8px;}
.d__h em{font-style:normal;font-size:46px;}
.d__s{font-size:13px;color:#5a5a5a;margin:0;}

/* E 現状 */
.e{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:3px 18px;padding:16px;background:#1a1a1a;color:#fff;}
.e__m{font-size:15px;font-weight:700;letter-spacing:.08em;}
.e__s{font-size:12.5px;opacity:.72;}

@media (max-width:600px){
  .a{flex-direction:column;min-height:0;}
  .a__img{width:100%;height:150px;}
  .a__txt{padding:20px;}
  .a__h{font-size:23px;} .a__h em{font-size:32px;}
  .b{flex-direction:column;min-height:0;}
  .b__txt{padding:20px;width:100%;}
  .b__h{font-size:25px;} .b__h em{font-size:34px;}
  .b__ims{height:112px;width:100%;}
  .b__ims span{flex:1;width:auto;}
  .c{min-height:170px;}
  .c__h{font-size:25px;} .c__h em{font-size:34px;}
  .d{padding:24px 18px;}
  .d__h{font-size:25px;} .d__h em{font-size:34px;}
}
</style></head><body><div class="wrap">

<p class="lab">案A　写真を左に置いた2分割</p>
<div class="card"><a href="#"><div class="a">
 <div class="a__img"></div>
 <div class="a__txt">
  <p class="a__eye">SALE</p>
  <p class="a__h">全商品 <em>最大50%</em> OFF</p>
  <p class="a__s">再入荷の予定はありません。<br>サイズ・色がそろっているうちに。</p>
  <span class="a__b">すべて見る</span>
 </div></div></a></div>

<p class="lab">案B　大きな文字＋商品カット3枚</p>
<div class="card"><a href="#"><div class="b">
 <div class="b__txt">
  <p class="b__eye">SALE</p>
  <p class="b__h">全商品 <em>最大50%</em> OFF</p>
  <p class="b__s">再入荷の予定はありません</p>
 </div>
 <div class="b__ims">
  <span style="background-image:url('p1.jpg')"></span>
  <span style="background-image:url('p2.jpg')"></span>
  <span style="background-image:url('p3.jpg')"></span>
 </div></div></a></div>

<p class="lab">案C　写真を全面に敷いて文字を重ねる</p>
<div class="card"><a href="#"><div class="c"><div class="c__in">
  <p class="c__eye">SALE</p>
  <p class="c__h">全商品 <em>最大50%</em> OFF</p>
  <p class="c__s">再入荷の予定はありません</p>
  <span class="c__b">すべて見る</span>
</div></div></a></div>

<p class="lab">案D　写真なし・文字を大きく（クリーム地）</p>
<div class="card"><a href="#"><div class="d">
  <p class="d__eye">SALE</p>
  <p class="d__h">全商品 <em>最大50%</em> OFF</p>
  <p class="d__s">再入荷の予定はありません</p>
</div></a></div>

<p class="lab">参考　いまの黒帯</p>
<div class="card"><a href="#"><div class="e"><span class="e__m">全商品 最大50%OFF</span><span class="e__s">再入荷の予定はありません</span></div></a></div>

</div></body></html>
